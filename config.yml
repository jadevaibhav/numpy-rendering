# config.yaml

image:
  width: 512
  height: 512
  spp: 16             # samples per pixel
  output_path: "outputs/render.png"

camera:
  eye: [0.0, 0.0, 3.0]
  look_at: [0.0, 0.0, 0.0]
  up: [0.0, 1.0, 0.0]
  fov: 45

sampler:
  type: Hemisphere   # or "Cosine", "UniformSphere", etc.
  num_samples: 64

objects:
  - type: Mesh
    path: "models/bunny.npz"
    brdf_params: [0.6, 0.6, 0.6, 1.0]
    Le: [0.0, 0.0, 0.0]

  - type: Sphere
    center: [1.5, 0.5, 0.0]
    radius: 0.5
    brdf_params: [0.2, 0.8, 0.2, 1.0]
    Le: [0.0, 0.0, 0.0]

  - type: Sphere
    center: [0.0, 3.0, 2.0]
    radius: 1.0
    brdf_params: [1.0, 1.0, 1.0, 1.0]
    Le: [15.0, 15.0, 15.0]  # light source
